{% if gallery %}
<section class="image-gallery" aria-label="{{ gallery_title }}">
  <h2>{{ gallery_title }}</h2>
  <div class="gallery-grid">
    {% for photo in gallery %}
    <figure>
      <a href="{{ photo.image.url }}" target="_blank" rel="noopener noreferrer" aria-label="Open full-size image: {{ photo.alt_text|default:gallery_title }}">
        <img src="{{ photo.image.url }}" alt="{{ photo.alt_text|default:gallery_title }}" width="600" height="400" loading="lazy" decoding="async">
      </a>
      {% if photo.caption %}<figcaption>{{ photo.caption }}</figcaption>{% endif %}
    </figure>
    {% endfor %}
  </div>
</section>
{% endif %}
