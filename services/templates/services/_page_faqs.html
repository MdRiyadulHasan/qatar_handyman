{% if page_faqs %}
<section class="section container" aria-labelledby="page-faq-heading">
  <div class="section-heading"><h2 id="page-faq-heading">Frequently asked questions</h2></div>
  <div class="faq-list">{% for faq in page_faqs %}<details><summary>{{ faq.question }} <span aria-hidden="true">+</span></summary><p>{{ faq.answer }}</p></details>{% endfor %}</div>
</section>
{% endif %}
